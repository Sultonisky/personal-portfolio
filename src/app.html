<!DOCTYPE html>
<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<meta name="text-scale" content="scale" />
		<!-- Primary Meta Tags -->
		<title>Mohammad Sultoni | Web Developer Portfolio</title>
		<meta name="title" content="Mohammad Sultoni | Web Developer Portfolio" />

		<!-- Open Graph / Facebook -->

		<meta property="twitter:card" content="summary_large_image" />

		<meta property="twitter:description" content="Backend Developer from Indonesia. Building robust data flows and architecting minimal, performant systems." />
		<meta property="twitter:image" content="/images/screen.png" />

		<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="antialiased min-h-screen flex flex-col font-body-md text-body-md selection:bg-primary-container selection:text-primary">
		<div style="display: contents">%sveltekit.body%</div>
